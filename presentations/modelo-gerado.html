<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../presentation-engine/presentation.css"><style>body{overflow:hidden}.generated{position:absolute;inset:0}.generated img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}.generated .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,18,24,.94),rgba(20,18,24,.28))}.generated .copy{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(38px,8vw,130px);max-width:850px}.generated h1{font-size:clamp(42px,7vw,105px);line-height:.95;margin:0}.generated p{font-size:clamp(18px,2vw,29px);line-height:1.45;color:#e6dfe8}.generated .logo{position:absolute;right:28px;top:25px;width:170px;z-index:2}.deck{height:100vh;overflow:auto;scroll-snap-type:y mandatory}.scene{height:100vh;scroll-snap-align:start;position:relative;overflow:hidden}.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;animation:drift 12s ease-in-out infinite alternate}.scene .copy{position:relative;z-index:1;height:100%;max-width:760px;display:flex;flex-direction:column;justify-content:center;padding:clamp(50px,9vw,150px);background:linear-gradient(90deg,rgba(20,18,24,.93),rgba(20,18,24,.56),transparent)}.scene h2{font-size:clamp(38px,6vw,88px);line-height:.96;margin:0}.scene p{font-size:clamp(17px,1.8vw,27px);line-height:1.45;color:#e6dfe8}@keyframes drift{to{transform:scale(1.09) translateX(2%)}}</style><title>Apresentação</title></head><body><main id="root"></main><script src="../js/catalogo.js"></script><script>const q=new URLSearchParams(location.search),id=q.get('id'),stage=q.get('etapa');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));Catalogo.load().then(list=>{const p=list.find(x=>x.id===id),d=p?.conteudo?.[stage];if(!p||!d)return;const logo='../assets/logo-lockup.png',root=document.querySelector('#root');if(stage==='apresentacao'){root.innerHTML=`<div class="deck">${d.blocos.map(b=>`<section class="scene"><img src="${esc(b.imagem)}"><div class="copy"><p>${esc(b.titulo)}</p><h2>${esc(b.texto)}</h2></div></section>`).join('')}</div><img class="logo" src="${logo}">`;return}root.innerHTML=`<section class="generated"><img src="${esc(d.imagem)}"><div class="shade"></div><img class="logo" src="${logo}"><div class="copy"><p>${esc(d.texto)}</p><h1>${esc(d.titulo)}</h1></div></section>`})</script></body></html>
